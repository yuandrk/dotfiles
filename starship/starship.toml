# Starship prompt: powerline segments —
# [zmx] user > directory > git > language > k8s/docker > time

format = """
${env_var.ZMX_SESSION}\
[](#9A348E)\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$golang\
$nodejs\
$python\
[](fg:#86BBD8 bg:#06969A)\
$kubernetes\
$docker_context\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""

# Active zmx session — zmx sets ZMX_SESSION inside one; hidden otherwise
[env_var.ZMX_SESSION]
format = '[\[$env_value\]]($style) '
style = "bold fg:#9A348E"

[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = '[$user ]($style)'

[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#FCA17D"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#FCA17D"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version)( \($virtualenv\)) ]($style)'

[kubernetes]
symbol = "☸ "
style = "bg:#06969A"
format = '[ $symbol $context( \($namespace\)) ]($style)'
disabled = false
# Shown only where a kubeconfig is in sight ($HOME, or a repo carrying one).
# Delete the two detect_* lines to show the context everywhere.
detect_files = ['kubeconfig', '.kubeconfig']
detect_folders = ['.kube']

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = '[ ♥ $time ]($style)'
